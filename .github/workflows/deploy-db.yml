name: Deploy database

# Manual only: applies new migrations and redeploys the Edge Function on a hosted project.
# Needs the secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD, and the project ref
# (input, or the repository variable SUPABASE_PROJECT_REF).
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project ref (empty = vars.SUPABASE_PROJECT_REF)
        required: false
      dry_run:
        description: Only show the migrations that would be applied
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ inputs.project_ref || vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Link
        run: |
          test -n "$PROJECT_REF" || { echo "::error::No project ref"; exit 1; }
          supabase link --project-ref "$PROJECT_REF"
      # CLI 3: `db` commands target the local stack unless --remote is given, and
      # changes to a hosted project need --yes when nobody can answer the prompt.
      - name: Migrations (dry run)
        if: inputs.dry_run
        run: supabase db push --remote --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Migrations
        if: ${{ !inputs.dry_run }}
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"
      - name: Edge Function
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy admin-users --yes
