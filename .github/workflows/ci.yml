name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 3.0.0
  NODE_VERSION: 22

jobs:
  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (db lint, pgTAP, Edge Function tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: admin-users unit tests
        run: deno test --no-lock --config supabase/functions/admin-users/deno.json supabase/functions/admin-users/
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start the local stack (migrations + seed.sql)
        # Auth and Storage stay on: they create the auth/storage schemas the migrations use.
        run: supabase start -x imgproxy,studio,logflare,vector,supavisor,realtime,mailpit,edge-runtime
      - run: supabase db lint --level warning --fail-on error
      - run: supabase test db

  e2e:
    name: E2E (Playwright, local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            scripts/package-lock.json
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start the local stack
        run: supabase start -x imgproxy,studio,logflare,vector,supavisor
      - name: Upload demo photos
        working-directory: scripts
        run: |
          npm ci
          node demo-images.mjs --local
      - name: Point the frontend at the stack
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > frontend/.env.local
      - run: npm ci
        working-directory: frontend
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
